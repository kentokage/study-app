<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chiikawa's Apple Run</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <button class="reset-button" id="reset-button" type="button">↻ New run</button>
    </header>

    <section class="game-card">
      <div class="canvas-wrap"><canvas id="game" width="960" height="500" aria-label="Chiikawa apple jumping game"></canvas><div class="canvas-hud" aria-label="Game score"><div class="hud-stat"><span>🍎</span><div><small>Apples</small><strong id="apple-count">0</strong></div></div><div class="hud-stat"><span>🏆</span><div><small>Best</small><strong id="best-score">0</strong></div></div></div><div class="game-message" id="game-message"><span class="message-emoji">🌿</span><strong>Help Chiikawa gather apples!</strong><span>Press ↑ to jump · ← → to move</span><button id="start-button" type="button">Start running</button></div><div class="mobile-controls" aria-label="Mobile movement controls"><button id="mobile-left" type="button" aria-label="Move left">←</button><button id="mobile-right" type="button" aria-label="Move right">→</button></div></div>
      <div class="controls"><div class="key-guide"><span class="key">←</span><span class="key">→</span><span>Move</span></div><div class="key-guide"><span class="key">↑</span><span>Jump</span></div><span class="hint">Collect every apple you can and hop over the stumps.</span><span class="mobile-hint">Use the big arrows to move · tap anywhere to jump</span></div>
    </section>
    <p class="footer-note">Tip: stay light on your feet — the forest keeps changing!</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
